<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario</title>
    <style>
        body {
            background-color: #dcecfc;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #e6c65c;
            padding: 15px;
            background: #f2f8ff;
        }

        .titulo {
            color: #d9a404;
            margin: 0;
        }

        .contenido {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #e6c65c;
            background: #f2f8ff;
            border-radius: 10px;
        }

        .contenido label {
            display: block;
            color: #1f4e79;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .contenido input[type="text"] {
            width: 96%;
            padding: 10px;
            border: 1px solid #e6c65c;
            border-radius: 4px;
            font-size: 16px;
            background: #fff;
            color: #1f4e79;
            margin-bottom: 15px;
        }

        .contenido textarea {
            width: 96%;
            height: 300px;
            padding: 10px;
            border: 1px solid #e6c65c;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
            color: #1f4e79;
            resize: vertical;
            margin-bottom: 15px;
        }

        .botones {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 10px 25px;
            font-size: 16px;
            color: #1f4e79;
            background: transparent;
            border: 2px solid #e0a91f;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(224, 169, 31, 0.5), inset 0 0 10px rgba(224, 169, 31, 0.12);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #e0a91f;
            color: #fff;
        }

        .guardado {
            text-align: center;
            color: #2e7d32;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f4e79;
            text-decoration: none;
            border: 1px solid #e6c65c;
            padding: 8px 20px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .volver:hover {
            background: #e6c65c;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="titulo">Mi Diario</h1>
    </div>

    <div class="contenido">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" placeholder="Escribe un título...">

        <label for="texto">Escribe lo que quieras:</label>
        <textarea id="texto" placeholder="Hoy me siento..."></textarea>

        <div class="botones">
            <button class="btn" id="btn-guardar">Guardar</button>
            <button class="btn" id="btn-limpiar">Limpiar</button>
        </div>

        <p class="guardado" id="mensaje">¡Guardado correctamente!</p>

        <a href="menu.html" class="volver">Volver al Menú</a>
    </div>

    <script>
        const tituloInput = document.getElementById("titulo");
        const textoArea = document.getElementById("texto");
        const btnGuardar = document.getElementById("btn-guardar");
        const btnLimpiar = document.getElementById("btn-limpiar");
        const mensaje = document.getElementById("mensaje");

        const guardado = localStorage.getItem("diario");
        if (guardado) {
            const datos = JSON.parse(guardado);
            tituloInput.value = datos.titulo;
            textoArea.value = datos.texto;
        }

        btnGuardar.addEventListener("click", () => {
            const datos = {
                titulo: tituloInput.value,
                texto: textoArea.value
            };
            localStorage.setItem("diario", JSON.stringify(datos));
            mensaje.style.display = "block";
            setTimeout(() => {
                mensaje.style.display = "none";
            }, 2000);
        });

        btnLimpiar.addEventListener("click", () => {
            tituloInput.value = "";
            textoArea.value = "";
        });
    </script>
</body>
</html>
