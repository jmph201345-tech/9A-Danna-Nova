<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú</title>
    <style>
        body {
            background-color: #dcecfc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .menu-container {
            text-align: center;
            border: 1px solid #e6c65c;
            padding: 40px;
            background: #f2f8ff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(224, 169, 31, 0.3);
        }

        .titulo {
            color: #d9a404;
            margin-bottom: 30px;
        }

        .botones-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .boton-menu {
            padding: 20px 40px;
            font-size: 18px;
            color: #1f4e79;
            background: transparent;
            border: 2px solid #e0a91f;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 8px rgba(224, 169, 31, 0.5), inset 0 0 10px rgba(224, 169, 31, 0.12);
            transition: all 0.3s ease;
        }

        .boton-menu:hover {
            background: #e0a91f;
            color: #fff;
        }

        .volver {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            color: #1f4e79;
            text-decoration: none;
            border: 1px solid #e6c65c;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .volver:hover {
            background: #e6c65c;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h1 class="titulo">Menú</h1>

        <div class="botones-menu">
            <a href="diario.html" class="boton-menu">Diario</a>
            <a href="juego.html" class="boton-menu">Juego</a>
            <a href="tareas.html" class="boton-menu">Tareas</a>
            <a href="calculadora.html" class="boton-menu">Calculadora</a>
        </div>

        <a href="index.html" class="volver">Volver</a>
    </div>
</body>
</html>
