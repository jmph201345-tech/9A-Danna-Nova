<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            background-color: #dcecfc;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #e6c65c;
            padding: 15px;
            background: #f2f8ff;
        }
        .titulo { color: #d9a404; margin: 0; }
        .contenido {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #e6c65c;
            background: #f2f8ff;
            border-radius: 10px;
            text-align: center;
        }
        .contenido p { color: #1f4e79; font-size: 18px; }
        .volver {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: #1f4e79;
            text-decoration: none;
            border: 1px solid #e6c65c;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .volver:hover { background: #e6c65c; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="titulo">Calculadora</h1>
    </div>
    <div class="contenido">
        <p>Próximamente...</p>
        <a href="menu.html" class="volver">Volver al Menú</a>
    </div>
</body>
</html>
